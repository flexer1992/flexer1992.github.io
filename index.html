<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CppStarter</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: sans-serif;
            font-size: 18px;
            text-align: center;
        }
        #errors {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: red;
            font-family: monospace;
            font-size: 12px;
            max-width: 90%;
            max-height: 40%;
            overflow: auto;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <canvas id="canvas" tabindex="1"></canvas>
    <div id="errors"></div>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            setStatus: function(text) {
                var status = document.getElementById('status');
                if (!status) return;
                if (text && String(text).indexOf('Running') !== -1) {
                    status.style.display = 'none';
                    return;
                }
                status.textContent = text;
            },
            onRuntimeInitialized: function() {
                var status = document.getElementById('status');
                if (status) status.style.display = 'none';
                console.log("Runtime initialized");

                // Check WebGL context after runtime is ready
                var canvas = document.getElementById('canvas');
                if (canvas) {
                    canvas.focus({ preventScroll: true });
                    canvas.addEventListener('pointerdown', function () {
                        canvas.focus({ preventScroll: true });
                    }, { passive: true });
                    var gl = canvas.getContext('webgl2');
                    if (gl) {
                        console.log("WebGL2 context obtained");
                        console.log("GL Version:", gl.getParameter(gl.VERSION));
                        console.log("GL Renderer:", gl.getParameter(gl.RENDERER));
                        console.log("GL Vendor:", gl.getParameter(gl.VENDOR));
                    } else {
                        gl = canvas.getContext('webgl');
                        if (gl) {
                            console.log("WebGL1 context obtained (fallback)");
                        } else {
                            console.error("No WebGL context available!");
                        }
                    }
                }
            }
        };
    </script>
    <script src="CppStarterWeb.js"></script>
</body>
</html>
